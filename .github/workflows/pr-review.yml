name: '🔎 PR-noia Security Review'

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Pull request number to review'
        required: true
        type: number

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    # This repository is public. Each run uses the PR-noia secrets and a
    # paid scan, so the job only runs for:
    #   - pull requests opened from a branch of this repository (fork PRs are
    #     skipped; GitHub does not pass secrets to them anyway),
    #   - manual runs (workflow_dispatch needs write access), and
    #   - `/review` comments from the owner, members or collaborators.
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '/review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'

    steps:
      # On issue_comment and workflow_dispatch this checks out the default
      # branch, not the pull request. Keep it that way: the steps below run
      # .github/scripts with the secrets, so they must never come from the PR
      # head. The PR itself is only read as data (gh pr view / gh pr diff).
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
          persist-credentials: 'false'

      - name: 'Post status comment'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          PR_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}'
          REPO: '${{ github.repository }}'
        run: |-
          gh issue comment "$PR_NUMBER" --repo "$REPO" --body "🔎 **PR-noia** is analyzing this pull request for security issues. A summary will be posted here when the review completes. Comment \`/review\` any time to re-run."

      - name: 'Set up Python'
        uses: 'actions/setup-python@v4'
        with:
          python-version: '3.11'

      - name: 'Install dependencies'
        run: |-
          python -m pip install --upgrade pip
          pip install requests

      - name: 'Collect PR data and assets'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          PR_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}'
          REPO: '${{ github.repository }}'
        run: |-
          mkdir -p ./pr_assets
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json number,title,body,author,baseRefName,headRefName,headRefOid,files \
            > ./pr_assets/pr_info.json
          gh pr diff "$PR_NUMBER" --repo "$REPO" > ./pr_assets/pr_diff.patch
          gh api graphql \
            -F owner='${{ github.repository_owner }}' \
            -F name='${{ github.event.repository.name }}' \
            -F number="$PR_NUMBER" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    comments(first: 100) {
                      nodes { author { login } body createdAt }
                    }
                  }
                }
              }
            ' > ./pr_assets/pr_comments.json

      - name: 'Submit scan and wait for the review'
        env:
          PRNOIA_SERVER_URL: '${{ secrets.PRNOIA_SERVER_URL }}'
          PRNOIA_API_KEY: '${{ secrets.PRNOIA_API_KEY }}'
          GITHUB_REPOSITORY: '${{ github.repository }}'
        run: |-
          python .github/scripts/prnoia_client.py

      - name: 'Post the review to the pull request'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GITHUB_REPOSITORY: '${{ github.repository }}'
          PR_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}'
        run: |-
          python .github/scripts/post_comment.py
