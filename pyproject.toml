[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3.4,<10.0.0",
  "pytest-asyncio>=0.23.8,<2.0.0",
  "nest-asyncio>=1.6.0,<2.0.0",
]

[project]
name = "a2ui-adk-agent"
version = "0.1.0"
description = "Facilities & Operations Incident Report Agent with A2UI v0.9 for Google ADK"
authors = [
  {name = "Yonit", email = "yonitg@google.com"}
]
dependencies = [
  "google-adk>=1.28.1,<2.0.0",
  "a2a-sdk[http-server]>=0.3.25,<0.4",
  "google-genai>=1.27.0",
  "nest-asyncio>=1.6.0,<2.0.0",
  "google-cloud-logging>=3.12.0,<4.0.0",
  "google-cloud-aiplatform>=1.84.0",
  "pillow>=10.0.0",
  "fastapi>=0.115.8,<1.0.0",
  "uvicorn~=0.34.0",
  "a2ui-agent-sdk>=0.3.0",
  "json-repair>=0.30,<1.0",
  "jsonschema>=4.0.0",
  "python-dotenv>=1.1.0",
  "click>=8.1.8",
]
requires-python = ">=3.11,<3.14"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
